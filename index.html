<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ロジックツリー</title>
<style>
  :root{
    --ink:#1C2126;
    --ink-soft:#5B646D;
    --ink-faint:#8F98A1;
    --line:#DCDFE3;
    --line-soft:#E8EAED;
    --paper:#FFFFFF;
    --canvas:#F1F2F3;
    --accent:#26456E;
    --accent-soft:#E7EDF5;
    --danger:#8E2F2F;
    --radius:7px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic Medium","Yu Gothic",Meiryo,sans-serif;
    color:var(--ink);
    background:var(--canvas);
    display:flex;
    flex-direction:column;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- top bar ---------- */
  header{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 16px;
    background:var(--paper);
    border-bottom:1px solid var(--line);
    flex-wrap:wrap;
  }
  #docName{
    font-size:15px;
    font-weight:600;
    color:var(--ink);
    border:1px solid transparent;
    border-radius:var(--radius);
    padding:5px 8px;
    min-width:180px;
    max-width:320px;
    flex:1 1 180px;
    font-family:inherit;
    background:transparent;
  }
  #docName:hover{border-color:var(--line)}
  #docName:focus{outline:none;border-color:var(--accent);background:#fff}
  .spacer{flex:1 1 auto}
  .group{display:flex;align-items:center;gap:6px}
  button,select{
    font-family:inherit;
    font-size:13px;
    color:var(--ink);
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:6px 10px;
    cursor:pointer;
    line-height:1.2;
  }
  button:hover,select:hover{border-color:var(--ink-faint)}
  button:active{transform:translateY(1px)}
  select{max-width:170px}
  .icon-btn{padding:6px 9px;min-width:32px;text-align:center}
  .danger-btn:hover{border-color:var(--danger);color:var(--danger)}
  .zoom-label{font-size:12px;color:var(--ink-soft);min-width:38px;text-align:center}

  /* ---------- canvas ---------- */
  main{
    flex:1 1 auto;
    overflow:auto;
    padding:28px 32px 80px;
    background-color:var(--canvas);
    background-image:radial-gradient(var(--line) 1px,transparent 1px);
    background-size:22px 22px;
  }
  #stage{transform-origin:0 0;display:inline-block;min-width:100%}

  /* ---------- tree ---------- */
  .row{display:flex;align-items:center}
  .kids{display:flex;flex-direction:column;position:relative}
  .kids::before{content:"";position:absolute;left:0;top:50%;width:20px;height:1px;background:var(--line);}
  .kid{position:relative;padding:6px 0 6px 44px}
  .kid::before{content:"";position:absolute;left:20px;top:50%;width:24px;height:1px;background:var(--line)}
  .kid::after{content:"";position:absolute;left:20px;top:0;bottom:0;width:1px;background:var(--line)}
  .kid:first-child::after{top:50%}
  .kid:last-child::after{bottom:50%}
  .kid:only-child::after{display:none}

  /* 横型：ルートを上揃えにし、L字コネクタで枝につなぐ */
  .row.top{align-items:flex-start}
  .row.top > .kids::before{top:var(--stub,50%)}
  .row.top > .kids::after{
    content:"";position:absolute;left:20px;width:1px;
    top:var(--elbow-top,50%);height:var(--elbow-h,0);
    background:var(--line);
  }

  /* ---------- 縦型レイアウト ---------- */
  .vert .row{flex-direction:column;align-items:center}
  .vert .kids{flex-direction:row;align-items:flex-start}
  .vert .kids::before{left:50%;top:0;width:1px;height:22px}
  .vert .kid{padding:44px 9px 6px 9px}
  .vert .kid::before{left:50%;top:22px;width:1px;height:22px}
  .vert .kid::after{left:0;right:0;top:22px;bottom:auto;width:auto;height:1px}
  .vert .kid:first-child::after{left:50%;right:0;top:22px}
  .vert .kid:last-child::after{left:0;right:50%;top:22px}
  .vert .kid:only-child::after{display:none}
  .vert .toggle{
    right:auto;left:50%;top:auto;bottom:-11px;transform:translateX(-50%);
  }

  .node{
    position:relative;
    display:flex;
    align-items:center;
    gap:4px;
    width:300px;
    flex:0 0 300px;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:7px 8px 7px 10px;
    box-shadow:0 1px 0 rgba(28,33,38,.04);
    -webkit-print-color-adjust:exact;
    print-color-adjust:exact;
  }
  .node.is-root{
    background:var(--ink);
    border-color:var(--ink);
  }
  .node.is-root .text{color:#fff;font-weight:600}
  .node.tinted .text{color:var(--ink);font-weight:600}
  .node.depth-1{border-left:3px solid var(--accent)}
  .node.tinted{border-left-width:3px}
  .node.focused{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

  .text{
    flex:1 1 auto;
    font-size:13.5px;
    line-height:1.5;
    outline:none;
    min-width:30px;
    word-break:break-word;
    white-space:pre-wrap;
  }
  .text:empty::before{content:"（未入力）";color:var(--ink-faint)}

  .tools{
    position:absolute;top:-14px;right:6px;
    display:flex;gap:1px;padding:1px;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:6px;
    box-shadow:0 2px 6px rgba(28,33,38,.10);
    opacity:0;pointer-events:none;transition:opacity .12s;z-index:6;
  }
  .node:hover .tools,.node:focus-within .tools{opacity:1;pointer-events:auto}
  .t{
    width:22px;height:22px;padding:0;border:none;background:transparent;
    color:var(--ink-faint);font-size:14px;line-height:1;border-radius:4px;
    display:flex;align-items:center;justify-content:center;
  }
  .t:hover{background:var(--line-soft);color:var(--ink)}
  .t.del:hover{background:#F6E9E9;color:var(--danger)}

  .toggle{
    position:absolute;right:-11px;top:50%;transform:translateY(-50%);
    width:20px;height:20px;border-radius:50%;
    border:1px solid var(--line);background:var(--paper);
    font-size:11px;color:var(--ink-soft);
    display:flex;align-items:center;justify-content:center;padding:0;z-index:2;
  }
  .toggle:hover{border-color:var(--accent);color:var(--accent)}

  .palette{
    position:absolute;top:100%;left:0;margin-top:6px;
    display:flex;gap:5px;padding:7px;
    background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:0 6px 18px rgba(28,33,38,.16);z-index:30;
  }
  .sw{
    width:19px;height:19px;padding:0;border-radius:50%;
    border:1px solid rgba(28,33,38,.18);cursor:pointer;
  }
  .sw:hover{transform:scale(1.15)}
  .sw.on{box-shadow:0 0 0 2px var(--ink)}
  .sw.clear{background:#fff;position:relative;overflow:hidden}
  .sw.clear::after{
    content:"";position:absolute;left:-2px;top:8px;width:23px;height:1px;
    background:var(--ink-faint);transform:rotate(-45deg);
  }

  /* ---------- footer hint ---------- */
  footer{
    flex:0 0 auto;
    padding:8px 16px;
    background:var(--paper);
    border-top:1px solid var(--line);
    font-size:12px;
    color:var(--ink-soft);
    display:flex;
    gap:16px;
    flex-wrap:wrap;
  }
  kbd{
    font-family:inherit;font-size:11px;
    border:1px solid var(--line);border-radius:4px;
    padding:1px 5px;background:var(--canvas);color:var(--ink);
  }
  #saved{margin-left:auto;color:var(--ink-faint)}

  @media print{
    header,footer{display:none}
    main{overflow:visible;background:#fff;padding:0}
    .tools,.toggle{display:none}
    body{background:#fff}
  }
</style>
</head>
<body>

<header>
  <input id="docName" value="無題のツリー" aria-label="ツリー名">
  <div class="group">
    <select id="docList" aria-label="保存済みのツリー"></select>
    <button id="newDoc">新規</button>
    <button id="deleteDoc" class="danger-btn">削除</button>
  </div>
  <div class="spacer"></div>
  <div class="group">
    <button id="layoutBtn">表示：横</button>
    <button class="icon-btn" id="zoomOut" aria-label="縮小">−</button>
    <span class="zoom-label" id="zoomLabel">100%</span>
    <button class="icon-btn" id="zoomIn" aria-label="拡大">＋</button>
  </div>
  <div class="group">
    <button id="expandAll">全展開</button>
    <button id="exportMd">Markdown</button>
    <button id="exportJson">JSON保存</button>
    <button id="importJson">読み込み</button>
    <button id="printBtn">印刷</button>
  </div>
</header>

<main id="canvas">
  <div id="stage"></div>
</main>

<footer>
  <span><kbd>Tab</kbd> 子を追加</span>
  <span><kbd>Enter</kbd> 兄弟を追加</span>
  <span><kbd>Shift</kbd>+<kbd>Enter</kbd> 改行</span>
  <span><kbd>Esc</kbd> 編集終了</span>
  <span>空欄で <kbd>Backspace</kbd> 削除</span>
  <span id="saved"></span>
</footer>

<input type="file" id="fileInput" accept="application/json" style="display:none">

<script>
(function () {
  "use strict";

  var KEY = "logic-tree-store-v1";

  var PALETTE = [
    { key: "", name: "色なし", bg: "", bd: "" },
    { key: "blue",   name: "青",   bg: "#E3EBF5", bd: "#26456E" },
    { key: "green",  name: "緑",   bg: "#E2EFE4", bd: "#3B6B43" },
    { key: "amber",  name: "黄",   bg: "#FAF0D8", bd: "#9A7420" },
    { key: "red",    name: "赤",   bg: "#F7E5E5", bd: "#8E2F2F" },
    { key: "purple", name: "紫",   bg: "#EBE8F5", bd: "#4E4783" },
    { key: "gray",   name: "灰",   bg: "#E7E9EB", bd: "#5B646D" }
  ];

  function colorOf(key) {
    for (var i = 0; i < PALETTE.length; i++) if (PALETTE[i].key === key) return PALETTE[i];
    return PALETTE[0];
  }
  var store = { docs: {}, current: null };
  var zoom = 1;
  var focusTarget = null;
  var saveTimer = null;

  /* ---------- model ---------- */

  function uid() {
    return "n" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  function newTree() {
    return {
      id: uid(), text: "論点（テーマ）", open: true,
      kids: [
        { id: uid(), text: "主要因 1", open: true, kids: [] },
        { id: uid(), text: "主要因 2", open: true, kids: [] },
        { id: uid(), text: "主要因 3", open: true, kids: [] }
      ]
    };
  }

  function newDoc(name) {
    var id = uid();
    store.docs[id] = { id: id, name: name || "無題のツリー", tree: newTree(), updated: Date.now() };
    store.current = id;
    return store.docs[id];
  }

  function doc() { return store.docs[store.current]; }

  function find(node, id, parent) {
    if (node.id === id) return { node: node, parent: parent };
    for (var i = 0; i < node.kids.length; i++) {
      var r = find(node.kids[i], id, node);
      if (r) return r;
    }
    return null;
  }

  function blank() { return { id: uid(), text: "", open: true, kids: [] }; }

  /* ---------- storage ---------- */

  function load() {
    var raw = null;
    try { raw = localStorage.getItem(KEY); } catch (e) { raw = null; }
    if (raw) {
      try {
        var parsed = JSON.parse(raw);
        if (parsed && parsed.docs && Object.keys(parsed.docs).length) {
          store = parsed;
          if (!store.docs[store.current]) store.current = Object.keys(store.docs)[0];
          return;
        }
      } catch (e) { /* 壊れたデータは無視して作り直す */ }
    }
    newDoc("無題のツリー");
  }

  function save() {
    if (doc()) doc().updated = Date.now();
    try {
      localStorage.setItem(KEY, JSON.stringify(store));
      note("保存しました");
    } catch (e) {
      note("このブラウザでは自動保存できません。JSONで書き出してください");
    }
  }

  function saveSoon() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(save, 400);
  }

  var noteTimer = null;
  function note(msg) {
    var el = document.getElementById("saved");
    el.textContent = msg;
    clearTimeout(noteTimer);
    noteTimer = setTimeout(function () { el.textContent = ""; }, 1800);
  }

  /* ---------- render ---------- */

  var stage = document.getElementById("stage");

  function makeTool(label, title, cls, fn) {
    var b = document.createElement("button");
    b.className = "t " + (cls || "");
    b.type = "button";
    b.textContent = label;
    b.title = title;
    b.setAttribute("aria-label", title);
    b.addEventListener("mousedown", function (e) { e.preventDefault(); });
    b.addEventListener("click", fn);
    return b;
  }

  function makeNode(node, depth) {
    var isRoot = depth === 0;
    var el = document.createElement("div");
    el.className = "node" + (isRoot ? " is-root" : "") + (depth === 1 ? " depth-1" : "");
    el.dataset.id = node.id;

    if (node.color) {
      var c = colorOf(node.color);
      el.classList.add("tinted");
      el.style.background = c.bg;
      el.style.borderColor = c.bd;
    }

    var txt = document.createElement("div");
    txt.className = "text";
    txt.contentEditable = "true";
    txt.spellcheck = false;
    txt.textContent = node.text;

    txt.addEventListener("input", function () {
      node.text = txt.textContent;
      alignRoot();
      saveSoon();
    });
    txt.addEventListener("focus", function () { el.classList.add("focused"); });
    txt.addEventListener("blur", function () { el.classList.remove("focused"); });
    txt.addEventListener("keydown", function (e) {
      if (e.key === "Escape") { txt.blur(); return; }

      if (e.key === "Tab") {
        e.preventDefault();
        var child = blank();
        node.kids.push(child);
        node.open = true;
        focusTarget = child.id;
        render(); save();
        return;
      }

      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        if (isRoot) {
          var first = blank();
          node.kids.push(first);
          node.open = true;
          focusTarget = first.id;
        } else {
          var f = find(doc().tree, node.id, null);
          var sib = blank();
          var i = f.parent.kids.indexOf(node);
          f.parent.kids.splice(i + 1, 0, sib);
          focusTarget = sib.id;
        }
        render(); save();
        return;
      }

      if (e.key === "Backspace" && txt.textContent === "" && !isRoot) {
        e.preventDefault();
        removeNode(node, true);
      }
    });

    el.appendChild(txt);

    var tools = document.createElement("div");
    tools.className = "tools";
    tools.appendChild(makeTool("＋", "子を追加", "", function () {
      var c = blank(); node.kids.push(c); node.open = true;
      focusTarget = c.id; render(); save();
    }));
    tools.appendChild(makeTool("●", "色を変える", "", function (e) {
      e.stopPropagation();
      openPalette(el, node);
    }));
    if (!isRoot) {
      tools.appendChild(makeTool("↳", "兄弟を追加", "", function () {
        var f = find(doc().tree, node.id, null);
        var s = blank();
        f.parent.kids.splice(f.parent.kids.indexOf(node) + 1, 0, s);
        focusTarget = s.id; render(); save();
      }));
      tools.appendChild(makeTool("×", "削除", "del", function () { removeNode(node, false); }));
    }
    el.appendChild(tools);

    if (node.kids.length) {
      var tg = document.createElement("button");
      tg.className = "toggle";
      tg.type = "button";
      tg.textContent = node.open === false ? String(node.kids.length) : "−";
      tg.title = node.open === false ? "展開" : "折りたたむ";
      tg.addEventListener("click", function () {
        node.open = node.open === false;
        render(); save();
      });
      el.appendChild(tg);
    }

    return el;
  }

  function closePalette() {
    var open = document.querySelector(".palette");
    if (open) open.parentNode.removeChild(open);
  }

  function openPalette(anchor, node) {
    var already = anchor.querySelector(".palette");
    closePalette();
    if (already) return;

    var box = document.createElement("div");
    box.className = "palette";
    box.addEventListener("click", function (e) { e.stopPropagation(); });

    PALETTE.forEach(function (c) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "sw" + (c.key ? "" : " clear") + ((node.color || "") === c.key ? " on" : "");
      b.title = c.name;
      b.setAttribute("aria-label", c.name);
      if (c.key) { b.style.background = c.bg; b.style.borderColor = c.bd; }
      b.addEventListener("mousedown", function (ev) { ev.preventDefault(); });
      b.addEventListener("click", function () {
        node.color = c.key;
        closePalette();
        render(); save();
      });
      box.appendChild(b);
    });

    anchor.appendChild(box);
  }

  document.addEventListener("click", closePalette);

  function removeNode(node, focusPrev) {
    var f = find(doc().tree, node.id, null);
    if (!f || !f.parent) return;
    var i = f.parent.kids.indexOf(node);
    f.parent.kids.splice(i, 1);
    if (focusPrev) focusTarget = i > 0 ? f.parent.kids[i - 1].id : f.parent.id;
    render(); save();
  }

  function makeRow(node, depth) {
    var row = document.createElement("div");
    row.className = "row";
    row.appendChild(makeNode(node, depth));
    if (node.kids.length && node.open !== false) {
      var kids = document.createElement("div");
      kids.className = "kids";
      node.kids.forEach(function (c) {
        var w = document.createElement("div");
        w.className = "kid";
        w.appendChild(makeRow(c, depth + 1));
        kids.appendChild(w);
      });
      row.appendChild(kids);
    }
    return row;
  }

  function alignRoot() {
    var row = stage.firstChild;
    if (!row || !row.classList || !row.classList.contains("top")) return;
    var node = null, kids = null;
    for (var i = 0; i < row.children.length; i++) {
      if (row.children[i].classList.contains("node")) node = row.children[i];
      if (row.children[i].classList.contains("kids")) kids = row.children[i];
    }
    if (!node || !kids || !kids.firstChild) return;

    var firstNode = kids.firstChild.querySelector(".node");
    if (!firstNode) return;

    var kr = kids.getBoundingClientRect();
    var fr = firstNode.getBoundingClientRect();
    var c1 = node.offsetHeight / 2;
    var c2 = (fr.top - kr.top) / (zoom || 1) + firstNode.offsetHeight / 2;

    kids.style.setProperty("--stub", c1 + "px");
    kids.style.setProperty("--elbow-top", Math.min(c1, c2) + "px");
    kids.style.setProperty("--elbow-h", Math.abs(c1 - c2) + "px");
  }

  function render() {
    var vertical = doc().layout === "v";
    stage.className = vertical ? "vert" : "";
    document.getElementById("layoutBtn").textContent = vertical ? "表示：縦" : "表示：横";
    stage.innerHTML = "";
    var rootRow = makeRow(doc().tree, 0);
    if (!vertical) rootRow.classList.add("top");
    stage.appendChild(rootRow);
    stage.style.transform = "scale(" + zoom + ")";
    document.getElementById("zoomLabel").textContent = Math.round(zoom * 100) + "%";
    document.getElementById("docName").value = doc().name;
    renderDocList();
    alignRoot();
    if (focusTarget) {
      var el = stage.querySelector('[data-id="' + focusTarget + '"] .text');
      focusTarget = null;
      if (el) {
        el.focus();
        var r = document.createRange();
        r.selectNodeContents(el);
        r.collapse(false);
        var s = window.getSelection();
        s.removeAllRanges();
        s.addRange(r);
      }
    }
  }

  function renderDocList() {
    var sel = document.getElementById("docList");
    sel.innerHTML = "";
    Object.keys(store.docs)
      .sort(function (a, b) { return store.docs[b].updated - store.docs[a].updated; })
      .forEach(function (id) {
        var o = document.createElement("option");
        o.value = id;
        o.textContent = store.docs[id].name;
        if (id === store.current) o.selected = true;
        sel.appendChild(o);
      });
  }

  /* ---------- export ---------- */

  function toMarkdown(node, depth) {
    var out = depth === 0
      ? "# " + (node.text || "(未入力)") + "\n\n"
      : "  ".repeat(depth - 1) + "- " + (node.text || "(未入力)") + "\n";
    node.kids.forEach(function (c) { out += toMarkdown(c, depth + 1); });
    return out;
  }

  function download(filename, text, type) {
    var blob = new Blob([text], { type: type || "text/plain;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  function safeName(s) {
    return (s || "logic-tree").replace(/[\\/:*?"<>|]/g, "_");
  }

  /* ---------- wiring ---------- */

  document.getElementById("docName").addEventListener("input", function (e) {
    doc().name = e.target.value || "無題のツリー";
    renderDocList();
    saveSoon();
  });

  document.getElementById("docList").addEventListener("change", function (e) {
    store.current = e.target.value;
    render(); save();
  });

  document.getElementById("newDoc").addEventListener("click", function () {
    newDoc("無題のツリー");
    render(); save();
    var n = document.getElementById("docName");
    n.focus(); n.select();
  });

  document.getElementById("deleteDoc").addEventListener("click", function () {
    if (!confirm("「" + doc().name + "」を削除します。よろしいですか？")) return;
    delete store.docs[store.current];
    var ids = Object.keys(store.docs);
    if (ids.length) store.current = ids[0]; else newDoc("無題のツリー");
    render(); save();
  });

  document.getElementById("layoutBtn").addEventListener("click", function () {
    doc().layout = doc().layout === "v" ? "h" : "v";
    render(); save();
  });

  document.getElementById("zoomIn").addEventListener("click", function () {
    zoom = Math.min(1.6, Math.round((zoom + 0.1) * 10) / 10); render();
  });
  document.getElementById("zoomOut").addEventListener("click", function () {
    zoom = Math.max(0.5, Math.round((zoom - 0.1) * 10) / 10); render();
  });

  document.getElementById("expandAll").addEventListener("click", function () {
    (function walk(n) { n.open = true; n.kids.forEach(walk); })(doc().tree);
    render(); save();
  });

  document.getElementById("exportMd").addEventListener("click", function () {
    download(safeName(doc().name) + ".md", toMarkdown(doc().tree, 0), "text/markdown;charset=utf-8");
  });

  document.getElementById("exportJson").addEventListener("click", function () {
    download(safeName(doc().name) + ".json", JSON.stringify(doc(), null, 2), "application/json");
  });

  document.getElementById("importJson").addEventListener("click", function () {
    document.getElementById("fileInput").click();
  });

  document.getElementById("fileInput").addEventListener("change", function (e) {
    var file = e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var d = JSON.parse(reader.result);
        if (!d || !d.tree) throw new Error("形式が違います");
        d.id = uid();
        d.name = d.name || "読み込んだツリー";
        d.updated = Date.now();
        store.docs[d.id] = d;
        store.current = d.id;
        render(); save();
        note("読み込みました");
      } catch (err) {
        alert("このファイルは読み込めません。このツールで書き出したJSONを選んでください。");
      }
      e.target.value = "";
    };
    reader.readAsText(file);
  });

  document.getElementById("printBtn").addEventListener("click", function () { window.print(); });

  document.addEventListener("keydown", function (e) {
    if ((e.metaKey || e.ctrlKey) && e.key === "s") { e.preventDefault(); save(); }
  });

  load();
  render();
})();
</script>
</body>
</html>
